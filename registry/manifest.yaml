# botcheck source registry — curated default bot/crawler feeds.
# Fetched at runtime by `botcheck update` (see registry_url in config).
# Lists WITH a publisher URL stay pointers (always fresh, no mirroring).
# Only sourceless lists (e.g. Meta, no publisher feed) are stored as data
# files under provider folders.
version: "2026-09-11"

sources:
  - name: google-common-crawlers
    category: search
    type: http
    url: https://developers.google.com/static/crawling/ipranges/common-crawlers.json
    enabled: true

  - name: google-user-triggered-fetchers
    category: fetch
    type: http
    url: https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers.json
    enabled: true

  - name: openai-chatgpt-user
    category: ai
    type: http
    url: https://openai.com/chatgpt-user.json
    enabled: true

  - name: openai-searchbot
    category: ai
    type: http
    url: https://openai.com/searchbot.json
    enabled: true

  - name: duckduckgo-duckduckbot
    category: search
    type: http
    url: https://duckduckgo.com/duckduckbot.json
    enabled: true

  - name: bingbot
    category: search
    type: http
    url: https://www.bing.com/toolbox/bingbot.json
    enabled: true

  - name: anthropic-claude
    category: ai
    type: http
    url: https://claude.com/crawling/bots.json
    enabled: true

  - name: perplexity-user
    category: ai
    type: http
    url: https://www.perplexity.ai/perplexity-user.json
    enabled: true

  - name: ahrefs
    category: seo
    type: http
    url: https://api.ahrefs.com/v3/public/crawler-ips
    enabled: true

  - name: applebot
    category: search
    type: http
    url: https://search.developer.apple.com/applebot.json
    enabled: true

  - name: facebook
    category: social
    type: http
    url: https://raw.githubusercontent.com/saurabhsharma2u/botcheck/main/registry/meta/fb.txt
    enabled: true
